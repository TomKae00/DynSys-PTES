# One full-year horizon (Danish calendar year 2024, 8,784 h) for Gurobi runs.
# Same tariffs as the weekly benchmarks; PTES starts and ends at 1,500 MWh once per year.
# Run with a long per-solve time limit, e.g. --time-limit 7200 (see docs/model_overview.md).
periods:
  - {name: year, start: '2023-12-31T23:00:00Z', hours: 8784}
sensitivities:
  # Gaps in relative terms of an annual objective: 1e-6 of HTF's bill is about 100 DKK.
  - {name: base, overrides: {response.local_mip_rel_gap: 1.0e-6, solver.mip_rel_gap: 1.0e-5}}
tariffs:
  - {name: constant_5, family: constant, level: 5}
  - {name: hourly_5_g025, family: bounded_mean_matched_value, level: 5, scale: 0.25, lower: 0, upper: 10}
  - {name: hourly_5_g025_direct_hourly, family: bounded_mean_matched_value, level: 5, scale: 0.25, lower: 0, upper: 10, direct_basis: monthly_mean_matched_marginal}
  - {name: share_025, family: shared_value, scale: 0.25}
  - {name: share_05, family: shared_value, scale: 0.5}
  - {name: share_10, family: shared_value, scale: 1.0}
