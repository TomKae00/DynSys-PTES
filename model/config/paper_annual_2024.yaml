# Main paper study as ONE full-year horizon (Gurobi recommended), compared with the
# measured 2024 PTES operation. Starts and ends at the measured 2024 inventory (needs --metered).
periods:
  - {name: year, start: '2024-01-01T00:00:00Z', hours: 8783}
sensitivities:
  # Relative gaps on annual objectives: 1e-6 of HTF's annual bill is about 100 DKK.
  - name: base
    overrides: {reference: metered_2024, ptes.endpoints: measured, response.local_mip_rel_gap: 1.0e-6, solver.mip_rel_gap: 1.0e-5}
tariffs:
  - {name: constant_5, family: constant, level: 5}
  - {name: hourly_5_g025, family: bounded_mean_matched_value, level: 5, scale: 0.25, lower: 0, upper: 10}
  - {name: share_025, family: shared_value, scale: 0.25}
  - {name: share_05, family: shared_value, scale: 0.5}
  - {name: share_10, family: shared_value, scale: 1.0}
