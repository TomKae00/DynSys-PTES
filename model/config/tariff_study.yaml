# Research design, not calibrated tariff parameters. Run selected periods/scenarios
# first: every scenario requires 3 + 2*N accepted PyPSA solves, plus conditional pricing.
periods:
  - {name: winter, start: '2024-01-08T00:00:00Z', hours: 168}
  - {name: shoulder, start: '2024-04-15T00:00:00Z', hours: 168}
  - {name: summer, start: '2024-07-15T00:00:00Z', hours: 168}
sensitivities:
  - name: base
  - name: pump_zero
    overrides: {ptes.pump_mwh_el_per_mwh_heat: 0.0}
  - name: pump_0025
    overrides: {ptes.pump_mwh_el_per_mwh_heat: 0.0025}
  - name: pump_003
    overrides: {ptes.pump_mwh_el_per_mwh_heat: 0.003}
  - name: pump_010
    overrides: {ptes.pump_mwh_el_per_mwh_heat: 0.01}
  - name: lossless
    overrides: {ptes.loss_per_hour: 0.0}
  - name: charge_23mw
    overrides: {ptes.charge_power_mw: 23.0}
  - name: discharge_23mw
    overrides: {ptes.discharge_power_mw: 23.0}
  - name: symmetric_23mw
    overrides: {ptes.power_mw: 23.0, ptes.discharge_power_mw: 23.0}
  - name: hp_full_output
    overrides: {heat_pumps.policy: must_run}
tariffs:
  - {name: credit_2, family: constant, level: 2}
  - {name: credit_5, family: constant, level: 5}
  - {name: credit_10, family: constant, level: 10}
  - {name: credit_50, family: constant, level: 50}
  - {name: value_raw, family: marginal_value, scale: 1, level: 0}
  - {name: value_mean_5, family: monthly_mean_matched_value, scale: 1, level: 5}
