# Controlled test of modest hourly discharge-price reductions.
# Current physical defaults: 30 MW each direction, pumping 0.005 per flow.
# Direct heat remains at the inherited monthly tariff in every case.
# Sample-month arithmetic means are matched after clipping, not revenues.
periods:
  - {name: winter, start: '2024-01-08T00:00:00Z', hours: 168}
  - {name: shoulder, start: '2024-04-15T00:00:00Z', hours: 168}
  - {name: summer, start: '2024-07-15T00:00:00Z', hours: 168}
sensitivities:
  - name: pump005_30_30
tariffs:
  - {name: constant_5, family: constant, level: 5}
  - {name: constant_10, family: constant, level: 10}
  - {name: constant_50, family: constant, level: 50}
  - {name: hourly_5_g025, family: bounded_mean_matched_value, level: 5, scale: 0.25, lower: 0, upper: 10}
  - {name: hourly_5_g1, family: bounded_mean_matched_value, level: 5, scale: 1, lower: 0, upper: 10}
