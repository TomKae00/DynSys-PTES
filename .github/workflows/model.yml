name: PyPSA dispatch model checks
on:
  push:
    paths: ['model/**', '.github/workflows/model.yml']
  pull_request:
    paths: ['model/**', '.github/workflows/model.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements-tested.txt
      - run: pip install -r requirements-tested.txt
      - run: pip install -e . --no-deps
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: cph-dispatch demo --hours 48 --prices --output results/ci_demo
      - run: cph-dispatch compare --synthetic --hours 24 --discount 50 --output results/ci_compare
